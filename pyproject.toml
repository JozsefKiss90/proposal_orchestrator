[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
markers = [
    "harness_regression: standing E4 golden-set comparison of the live Tier-5 sections against harness/regression_baselines (merge-advisory, human-decided; never run-blocking)",
    "harness_rubric: standing E5 rubric-grid lane — deterministic spine-register pins and re-render of any frozen rubric report (advisory, human-decided; never run-blocking)",
]
