# Pre-commit hooks for security scanning and code quality.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  # Secret detection — prevents accidental credential commits.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: >
          (?x)^(
            \.env\.example|
            tests/.*|
            docs/.*\.md
          )$

  # Standard pre-commit hooks for hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
        exclude: >
          (?x)^(
            \.claude/.*
          )$
      - id: end-of-file-fixer
        exclude: >
          (?x)^(
            \.claude/.*
          )$
      - id: trailing-whitespace
        exclude: >
          (?x)^(
            \.claude/.*
          )$

  # Prevent .env and credential files from being committed.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: detect-private-key
