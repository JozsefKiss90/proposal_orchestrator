# graph.config.yaml — MSCA reference instance (#1) binding contract
#
# The per-project instantiation layer of the milestone-2 graph substrate (D15).
# The generic layer (runner/graph_schema.py, runner/graph_config.py,
# runner/vault_reader.py, runner/graph_compiler.py) carries NO project bindings;
# they all live here. A second instance compiles with only this file changed
# (the agnosticism test, ticket 9).
#
# Loaded by runner/graph_config.py::load_graph_config; consumed by the
# graph→docs compiler (runner/graph_compiler.py, tickets 3/6) and, read-only,
# by the docs→graph projector (ticket 4).
#
# NOTE ON FOLDERS 11–18 (Tier-3/4/5 binding folders):
#   The current vault is methodology-only (folders 00–10, 90, 99; 87 nodes).
#   The Tier-3 architecture_inputs binding nodes (objective / outcome / impact /
#   work_package / timeline / risk / budget) live in folders 11–18, authored in
#   ticket 8. The bindings below are declared now and folder-scoped to 11–18, so
#   (a) today's compile is empty and the diff-vs-hand-lift residual is explained
#   (binding nodes await ticket 8), and (b) ticket 8's authoring compiles with no
#   code or config change. Folder-scoping also keeps the methodology `risk` nodes
#   in 07_risks_and_swot OUT of the Tier-3 risks.json extraction — they are the
#   compiler's source material for the hand-synthesised register, not structured
#   risk-record binding nodes.

project_id: msca-pf-reference
vault_path: methodology_graph

bindings:
  # ── Part B prose (Tier 5) — declared for the ticket-6 compiler slice; the
  #    ticket-3 Tier-3 compile ignores non-tier3 bindings. One proposal_section
  #    node per Part B sub-section.
  - match:
      node_type: proposal_section
    tier: tier5
    artifact_path: docs/tier5_deliverables/proposal_sections

  # ── Tier 3 architecture_inputs (folders 11–18, authored in ticket 8) ─────────
  - match:
      folder: "11_objectives"
      node_type: objective
    tier: tier3
    artifact_path: docs/tier3_project_instantiation/architecture_inputs/objectives.json
    collection_key: objectives

  - match:
      folder: "12_outcomes"
      node_type: outcome
    tier: tier3
    artifact_path: docs/tier3_project_instantiation/architecture_inputs/outcomes.json
    collection_key: outcomes

  - match:
      folder: "13_impacts"
      node_type: impact
    tier: tier3
    artifact_path: docs/tier3_project_instantiation/architecture_inputs/impacts.json
    collection_key: impacts

  - match:
      folder: "14_work_packages"
      node_type: work_package
    tier: tier3
    artifact_path: docs/tier3_project_instantiation/architecture_inputs/workpackage_seed.json
    collection_key: work_packages

  - match:
      folder: "15_timeline"
      node_type: timeline
    tier: tier3
    artifact_path: docs/tier3_project_instantiation/architecture_inputs/milestones_seed.json
    collection_key: milestones

  - match:
      folder: "16_risks"
      node_type: risk
    tier: tier3
    artifact_path: docs/tier3_project_instantiation/architecture_inputs/risks.json
    collection_key: risks

  # ── Budget binding nodes (Tier 3 source for the unit-cost derivation; no
  #    architecture_inputs artifact — source-only here). Folder 17, ticket 8.
  - match:
      folder: "17_budget"
      node_type: budget
    tier: tier3

  # ── Tier-4 phase/gate mirror — WRITTEN by the docs→graph projector (ticket 4),
  #    never extracted by this compiler. Declared source-only (tier4, no
  #    artifact_path) so the no-overlap invariant (D6) is explicit: graph_to_docs
  #    never routes an artifact for phase_gate_state.
  - match:
      folder: "18_phase_gate_state"
      node_type: phase_gate_state
    tier: tier4

  # ── Methodology source folders (Tier 3 source material, read not extracted) ──
  #    Declared source-only for provenance/agnosticism documentation; the reader
  #    reads every node regardless, so these are non-load-bearing but intentional.
  - match:
      folder: "04_methodological_routes"
    tier: tier3
  - match:
      folder: "05_decision_framework"
    tier: tier3
  - match:
      folder: "06_infrastructure"
    tier: tier3
  - match:
      folder: "07_risks_and_swot"
    tier: tier3
