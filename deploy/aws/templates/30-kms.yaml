AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  proposal-orchestrator KMS stack (filled by ticket R6): one customer-managed
  key with rotation on and the alias alias/proposal-orchestrator. Its key
  policy grants the account root, the admin role, the runtime role
  (imported from the IAM stack), CloudTrail scoped by source ARN and
  CloudWatch Logs scoped to the project's log-group prefix. Skeleton written
  in R3. Free of hourly cost. See deploy/aws/README.md.

Metadata:
  ProposalOrchestrator:
    Stack: kms
    StackName: proposal-orchestrator-kms
    FilledBy: R6
    Contract: deploy/aws/outputs_contract.json
    Decision: aws-redeployment-od6-stack-layout-r3_2026-10-22

Parameters:
  ProjectName:
    Type: String
    Default: proposal-orchestrator
    AllowedValues:
      - proposal-orchestrator
    Description: Name prefix of every resource and value of the project tag.
  ExpectedAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: The account this stack must be created in. A rule compares it with AWS::AccountId.
  ExpectedRegion:
    Type: String
    Default: eu-north-1
    AllowedPattern: "^[a-z]{2}-[a-z]+-[0-9]$"
    Description: The Region this stack must be created in (OD1-r1). A rule compares it with AWS::Region.
  AdminRoleArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"
    Description: >-
      The admin principal of the key policy (OD11-r2): the AWS-managed
      AccountFullAccessRole, with its path, exactly as
      evidence_v2/R1/R1_00_role.json reports its Arn.

Rules:
  DeployTarget:
    Assertions:
      - Assert: !Equals [!Ref ExpectedAccountId, !Ref "AWS::AccountId"]
        AssertDescription: The stack is not being created in ExpectedAccountId.
      - Assert: !Equals [!Ref ExpectedRegion, !Ref "AWS::Region"]
        AssertDescription: The stack is not being created in ExpectedRegion.

Resources:
  # R3 skeleton only. R6 replaces this no-cost placeholder with the key and
  # its alias and adds the outputs named in deploy/aws/outputs_contract.json.
  # The Metadata block references every parameter, so the skeleton lints
  # without unused-parameter warnings.
  SkeletonPlaceholder:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      SkeletonParameters:
        ProjectName: !Ref ProjectName
        AdminRoleArn: !Ref AdminRoleArn
