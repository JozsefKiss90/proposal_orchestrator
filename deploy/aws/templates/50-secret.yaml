AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  proposal-orchestrator runtime secret stack (filled by ticket R8, OD8 a):
  proposal-orchestrator/env-config, encrypted with the CMK, with a resource
  policy naming only the runtime role and the admin role. It holds the
  transport preset, production mode on, diagnostic level metadata, the
  Region and the transport model, and no credential. Skeleton written in R3.
  Free of hourly cost. See deploy/aws/README.md.

Metadata:
  ProposalOrchestrator:
    Stack: secret
    StackName: proposal-orchestrator-secret
    FilledBy: R8
    Contract: deploy/aws/outputs_contract.json
    Decision: aws-redeployment-od6-stack-layout-r3_2026-10-22

Parameters:
  ProjectName:
    Type: String
    Default: proposal-orchestrator
    AllowedValues:
      - proposal-orchestrator
    Description: Name prefix of every resource and value of the project tag.
  ExpectedAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: The account this stack must be created in. A rule compares it with AWS::AccountId.
  ExpectedRegion:
    Type: String
    Default: eu-north-1
    AllowedPattern: "^[a-z]{2}-[a-z]+-[0-9]$"
    Description: The Region this stack must be created in (OD1-r1). A rule compares it with AWS::Region.
  AdminRoleArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"
    Description: >-
      The admin principal of the secret's resource policy (OD11-r2), exactly
      as evidence_v2/R1/R1_00_role.json reports its Arn.
  TransportModelId:
    Type: String
    AllowedPattern: "^eu\\.anthropic\\.claude-[a-z0-9.:-]+$"
    Description: >-
      ORCHESTRATOR_TRANSPORT_MODEL on the host (OD7-orchestrator). Only eu.
      profiles are accepted; global. profiles are excluded (OD7-global).

Rules:
  DeployTarget:
    Assertions:
      - Assert: !Equals [!Ref ExpectedAccountId, !Ref "AWS::AccountId"]
        AssertDescription: The stack is not being created in ExpectedAccountId.
      - Assert: !Equals [!Ref ExpectedRegion, !Ref "AWS::Region"]
        AssertDescription: The stack is not being created in ExpectedRegion.

Resources:
  # R3 skeleton only. R8 replaces this no-cost placeholder with the secret
  # and its resource policy and adds the outputs named in
  # deploy/aws/outputs_contract.json. How the non-credential values enter
  # the secret is R8's to settle.
  SkeletonPlaceholder:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      SkeletonParameters:
        ProjectName: !Ref ProjectName
        AdminRoleArn: !Ref AdminRoleArn
        TransportModelId: !Ref TransportModelId
