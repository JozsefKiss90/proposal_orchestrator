AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  proposal-orchestrator runtime secret stack (filled by ticket R8, OD8 a):
  proposal-orchestrator/env-config, encrypted with the CMK imported from the
  kms stack, retained on deletion, with a deny-only resource policy: only the
  runtime role and the admin role read the value, only the admin role changes
  it, nobody outside the account acts on it. It holds the transport preset,
  production mode on, diagnostic level metadata, the Region and the transport
  model, and no credential. Free of hourly cost; the secret has a monthly fee.
  See deploy/aws/README.md.

Metadata:
  ProposalOrchestrator:
    Stack: secret
    StackName: proposal-orchestrator-secret
    FilledBy: R8
    Contract: deploy/aws/outputs_contract.json
    Decision: aws-redeployment-od6-stack-layout-r3_2026-10-22
    FillDecision: aws-redeployment-r8-secret_2026-10-26

Parameters:
  ProjectName:
    Type: String
    Default: proposal-orchestrator
    AllowedValues:
      - proposal-orchestrator
    Description: Name prefix of every resource and value of the project tag.
  ExpectedAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: The account this stack must be created in. A rule compares it with AWS::AccountId.
  ExpectedRegion:
    Type: String
    Default: eu-north-1
    AllowedPattern: "^[a-z]{2}-[a-z]+-[0-9]$"
    Description: The Region this stack must be created in (OD1-r1). A rule compares it with AWS::Region.
  AdminRoleArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role/.+$"
    Description: >-
      The admin principal of the secret's resource policy (OD11-r2), exactly
      as evidence_v2/R1/R1_00_role.json reports its Arn, with its one-segment
      path (/managed/). R8-D12 also matches it without the path.
  TransportModelId:
    Type: String
    AllowedPattern: "^eu\\.anthropic\\.claude-[a-z0-9.:-]+$"
    Description: >-
      ORCHESTRATOR_TRANSPORT_MODEL on the host (OD7-orchestrator). Only eu.
      profiles are accepted; global. profiles are excluded (OD7-global).

Rules:
  DeployTarget:
    Assertions:
      - Assert: !Equals [!Ref ExpectedAccountId, !Ref "AWS::AccountId"]
        AssertDescription: The stack is not being created in ExpectedAccountId.
      - Assert: !Equals [!Ref ExpectedRegion, !Ref "AWS::Region"]
        AssertDescription: The stack is not being created in ExpectedRegion.

Resources:
  # R8-D5: the secret outlives the stack. The host reads it (R9, R11), and a
  # secret scheduled for deletion is expected to hold its name through its
  # recovery window (not stated on the pages read, R8 known gap), so a
  # recreated stack could not take the name back. The secret stack is not
  # deleted. R8-D2: the five values are configuration, not credentials; they
  # change only by an UPDATE of this template, never by put-secret-value.
  EnvConfigSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/env-config"
      Description: >-
        Runtime configuration of the proposal-orchestrator host (R8, OD8 a):
        transport preset, production mode, diagnostic level, Region and
        transport model. Holds no credential.
      # R8-D16: the key ARN, so that describe-secret shows the R6 KeyArn.
      KmsKeyId: !ImportValue proposal-orchestrator-kms-KeyArn
      # R8-D2, R8-D3: one JSON object of exactly five keys. The preset name is
      # a lasting rule that R9e implements in runner/transport/config.py.
      SecretString: !Sub '{"ORCHESTRATOR_TRANSPORT_PRESET":"BEDROCK_CONVERSE_EU","ORCHESTRATOR_PRODUCTION_MODE":"true","ORCHESTRATOR_DIAGNOSTIC_LEVEL":"metadata","AWS_REGION":"${AWS::Region}","ORCHESTRATOR_TRANSPORT_MODEL":"${TransportModelId}"}'
      # R8-D15: the project tag only.
      Tags:
        - Key: project
          Value: !Ref ProjectName

  # R8-D4, R8-D12, R8-D13: deny-only. Same-account access comes from IAM
  # (R5's RuntimeSecretRead; the admin role's AdministratorAccess), so the
  # policy only takes away. No statement touches GetResourcePolicy,
  # PutResourcePolicy, DeleteResourcePolicy or DescribeSecret for a principal
  # of this account other than the runtime role: if the admin exception ever
  # failed to match, the admin role could still replace or remove the policy
  # (there is no root user to fall back on, F-OD11r2-3).
  EnvConfigSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref EnvConfigSecret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyRuntimeRoleExceptGetSecretValue
            Effect: Deny
            Principal: "*"
            NotAction: secretsmanager:GetSecretValue
            Resource: "*"
            Condition:
              ArnEquals:
                aws:PrincipalArn: !ImportValue proposal-orchestrator-iam-RuntimeRoleArn
          - Sid: DenyValueReadExceptRuntimeAndAdmin
            Effect: Deny
            Principal: "*"
            Action: secretsmanager:GetSecretValue
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !ImportValue proposal-orchestrator-iam-RuntimeRoleArn
                  - !Ref AdminRoleArn
                  - !Sub
                    - "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AdminRoleName}"
                    - AdminRoleName: !Select [2, !Split ["/", !Ref AdminRoleArn]]
          - Sid: DenyChangesExceptAdmin
            Effect: Deny
            Principal: "*"
            Action:
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecret
              - secretsmanager:UpdateSecretVersionStage
              - secretsmanager:DeleteSecret
              - secretsmanager:RestoreSecret
              - secretsmanager:RotateSecret
              - secretsmanager:CancelRotateSecret
              - secretsmanager:TagResource
              - secretsmanager:UntagResource
              - secretsmanager:ReplicateSecretToRegions
              - secretsmanager:RemoveRegionsFromReplication
              - secretsmanager:StopReplicationToReplica
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Ref AdminRoleArn
                  - !Sub
                    - "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AdminRoleName}"
                    - AdminRoleName: !Select [2, !Split ["/", !Ref AdminRoleArn]]
          - Sid: DenyPrincipalsOutsideAccount
            Effect: Deny
            Principal: "*"
            Action: secretsmanager:*
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:PrincipalAccount: !Ref "AWS::AccountId"

Outputs:
  SecretArn:
    Description: The runtime secret's ARN, with its random suffix (R9, R11, R12a).
    Value: !Ref EnvConfigSecret
    Export:
      Name: proposal-orchestrator-secret-SecretArn
  SecretName:
    Description: The runtime secret's name (R9, R12a).
    Value: !Sub "${ProjectName}/env-config"
    Export:
      Name: proposal-orchestrator-secret-SecretName
